server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite que o fallback do React funcione em qualquer rota da aplicação.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos estáticos compilados podem ser mantidos em cache pelo navegador.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
