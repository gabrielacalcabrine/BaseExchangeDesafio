services:
  database:
    image: postgres:16-alpine
    container_name: base-exchange-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    ports:
      - "5432:5432"
    volumes:
      - exchange_postgres_data:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: base-exchange-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ExchangeDatabase: Host=database;Port=5432;Database=exchange;Username=exchange;Password=exchange
    ports:
      - "3333:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  exchange_postgres_data:
